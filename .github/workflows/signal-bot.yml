name: CapitalGuard Signal Bot

# วิเคราะห์ตลาดและส่งสัญญาณเข้า Telegram โดยไม่ต้องเปิดคอมเอง
# GitHub รันให้ฟรีตามเวลาที่ตั้งไว้ด้านล่าง
on:
  schedule:
    # ทุก 5 นาที (ถี่ที่สุดที่ GitHub อนุญาต) ตลอด 24 ชม. วันจันทร์-ศุกร์
    # ตัวบอทเช็คเวลาตลาดปิด (ศุกร์ 22:00 - อาทิตย์ 22:00 UTC) ให้อีกชั้น
    #
    # ⚠️ โควตา: repo ส่วนตัวได้ฟรี 2,000 นาที/เดือน แต่ความถี่นี้ใช้
    #    ~6,300 นาที/เดือน — ถ้าไม่เปลี่ยน repo เป็น public จะเกินโควตา
    #    ราววันที่ 10 ของเดือน ดู docs/MOBILE_SETUP_TH.md หัวข้อโควตา
    - cron: "*/5 * * * 1-5"
  # ปุ่มกดรันเองจากมือถือ และเป็นช่องทางที่ cron ภายนอกใช้เรียกด้วย
  # (GitHub throttle ตาราง schedule ของ repo สาธารณะอย่างหนัก จริง ๆ
  #  ได้ราว 3-4 ชม./ครั้ง ไม่ใช่ 5 นาที ดู docs/MOBILE_SETUP_TH.md)
  #
  # ⚠️ ค่า default ต้องเป็น false ทั้งหมด: เมื่อ cron ภายนอกยิงมาโดยไม่ส่ง
  #    inputs GitHub จะเติม default ให้เอง ถ้าตั้ง true จะกลายเป็นส่ง
  #    รายงานภาพรวมทุกรอบ (~288 ข้อความ/วัน) ตอนกดปุ่มเองยังติ๊กได้ตามปกติ
  workflow_dispatch:
    inputs:
      status:
        description: "ส่งรายงานสถานะเข้า Telegram ด้วย"
        type: boolean
        default: false
      ignore_hours:
        description: "ข้ามการเช็คเวลาตลาด/kill zone (สำหรับทดสอบ)"
        type: boolean
        default: false
      daily:
        description: "ส่งบทวิเคราะห์ตลาดรายวันทันที (ไม่ต้องรอ 06:00 น.)"
        type: boolean
        default: false
      summary:
        description: "ส่งสรุปผลรายวันทันที (ไม่ต้องรอ 05:00 น.)"
        type: boolean
        default: false

# กันไม่ให้รันซ้อนกันจนสถานะสัญญาณเพี้ยน
concurrency:
  group: signal-bot
  cancel-in-progress: false

permissions:
  contents: write             # ต้องใช้เพื่อบันทึกสถานะสัญญาณกลับเข้า repo

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: ดึงโค้ด
        uses: actions/checkout@v4

      # ตรวจ Secrets ก่อนทำอย่างอื่น จะได้รู้สาเหตุทันทีถ้าตั้งค่าไม่ครบ
      - name: ตรวจว่าตั้งค่า Secrets ครบหรือยัง
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          missing=""
          [ -z "$TELEGRAM_BOT_TOKEN" ] && missing="$missing TELEGRAM_BOT_TOKEN"
          [ -z "$TELEGRAM_CHAT_ID" ] && missing="$missing TELEGRAM_CHAT_ID"

          if [ -n "$missing" ]; then
            echo "::error title=ยังไม่ได้ตั้งค่า Secrets::ขาด:$missing"
            echo ""
            echo "==================================================="
            echo " ยังไม่ได้ใส่ Secrets เหล่านี้:$missing"
            echo "==================================================="
            echo ""
            echo " วิธีแก้ (ทำบนมือถือได้):"
            echo " 1. ไปที่หน้า repo -> More -> Settings"
            echo " 2. เมนูซ้าย -> Secrets and variables -> Actions"
            echo " 3. กด New repository secret"
            echo " 4. เพิ่มทีละตัว (พิมพ์ชื่อตัวใหญ่ให้ตรงเป๊ะ):"
            echo "      TELEGRAM_BOT_TOKEN = token จาก @BotFather"
            echo "      TELEGRAM_CHAT_ID   = เลข Id จาก @userinfobot"
            echo " 5. กลับมาหน้านี้แล้วกด Run workflow ใหม่"
            echo ""
            exit 1
          fi

          # ตรวจรูปแบบคร่าว ๆ กันสลับค่ากัน (ไม่พิมพ์ค่าจริงออก log)
          case "$TELEGRAM_BOT_TOKEN" in
            *:*) ;;
            *) echo "::warning::TELEGRAM_BOT_TOKEN ไม่มีเครื่องหมาย ':' — อาจใส่สลับกับ CHAT_ID" ;;
          esac
          echo "Secrets ครบแล้ว (token ${#TELEGRAM_BOT_TOKEN} ตัวอักษร, chat id ${#TELEGRAM_CHAT_ID} ตัวอักษร)"

      - name: ติดตั้ง Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: signal_bot/requirements.txt

      - name: ติดตั้ง dependencies
        run: pip install -r signal_bot/requirements.txt

      - name: วิเคราะห์ตลาดและส่งสัญญาณ
        env:
          # --- ค่าที่ต้องตั้งเป็น Secret ---
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
          # --- ค่าที่ปรับได้ผ่าน Variables (ไม่ตั้งก็ใช้ค่าเริ่มต้น) ---
          PROFILES: ${{ vars.PROFILES }}
          TIER1_SYMBOLS: ${{ vars.TIER1_SYMBOLS }}
          TIER2_SYMBOLS: ${{ vars.TIER2_SYMBOLS }}
          TIER3_SYMBOLS: ${{ vars.TIER3_SYMBOLS }}
          ENTRY_TIMEFRAME: ${{ vars.ENTRY_TIMEFRAME }}
          SCORE_THRESHOLD: ${{ vars.SCORE_THRESHOLD }}
          MAX_SIGNALS_PER_DAY: ${{ vars.MAX_SIGNALS_PER_DAY }}
          DAILY_SIGNAL_TARGET: ${{ vars.DAILY_SIGNAL_TARGET }}
          GOLD_SYMBOLS: ${{ vars.GOLD_SYMBOLS }}
          ALLOW_GOLD_FUTURES: ${{ vars.ALLOW_GOLD_FUTURES }}
          GOLD_DAILY_TARGET: ${{ vars.GOLD_DAILY_TARGET }}
          GOLD_SCAN_MINUTES: ${{ vars.GOLD_SCAN_MINUTES }}
          ADAPTIVE_THRESHOLD: ${{ vars.ADAPTIVE_THRESHOLD }}
          MIN_SCORE_FLOOR: ${{ vars.MIN_SCORE_FLOOR }}
          MIN_REGIME_CONFIDENCE: ${{ vars.MIN_REGIME_CONFIDENCE }}
          STRICT_STRUCTURE: ${{ vars.STRICT_STRUCTURE }}
          USE_MACRO: ${{ vars.USE_MACRO }}
          MACRO_REFRESH_MINUTES: ${{ vars.MACRO_REFRESH_MINUTES }}
          SELF_LEARNING: ${{ vars.SELF_LEARNING }}
          COOLDOWN_MINUTES: ${{ vars.COOLDOWN_MINUTES }}
          SIGNAL_EXPIRY_HOURS: ${{ vars.SIGNAL_EXPIRY_HOURS }}
          USE_KILL_ZONES: ${{ vars.USE_KILL_ZONES }}
          REQUIRE_BOS_CHOCH: ${{ vars.REQUIRE_BOS_CHOCH }}
          REQUIRE_ORDER_BLOCK: ${{ vars.REQUIRE_ORDER_BLOCK }}
          REQUIRE_FVG: ${{ vars.REQUIRE_FVG }}
          REQUIRE_SWEEP: ${{ vars.REQUIRE_SWEEP }}
          REQUIRE_PREMIUM_DISCOUNT: ${{ vars.REQUIRE_PREMIUM_DISCOUNT }}
          REQUIRE_MITIGATION: ${{ vars.REQUIRE_MITIGATION }}
          MIN_OB_QUALITY: ${{ vars.MIN_OB_QUALITY }}
          DAILY_REPORT: ${{ vars.DAILY_REPORT }}
          DAILY_REPORT_HOURS: ${{ vars.DAILY_REPORT_HOURS }}
          PULSE_HOURS: ${{ vars.PULSE_HOURS }}
          NEWS_AGENDA: ${{ vars.NEWS_AGENDA }}
          NEWS_AGENDA_HOUR: ${{ vars.NEWS_AGENDA_HOUR }}
          MESSAGE_ARCHIVE: ${{ vars.MESSAGE_ARCHIVE }}
          ARCHIVE_DAYS: ${{ vars.ARCHIVE_DAYS }}
          SEARCH_RESULTS: ${{ vars.SEARCH_RESULTS }}
          DAILY_SUMMARY: ${{ vars.DAILY_SUMMARY }}
          DAILY_SUMMARY_HOUR: ${{ vars.DAILY_SUMMARY_HOUR }}
          MIN_ENTRY_TF: ${{ vars.MIN_ENTRY_TF }}
          GOLD_MIN_ENTRY_TF: ${{ vars.GOLD_MIN_ENTRY_TF }}
          MIN_SL_SPREADS: ${{ vars.MIN_SL_SPREADS }}
          STRATEGY_VOTING: ${{ vars.STRATEGY_VOTING }}
          VOTE_CONFLICT_BLOCKS: ${{ vars.VOTE_CONFLICT_BLOCKS }}
          DAILY_SYMBOLS: ${{ vars.DAILY_SYMBOLS }}
          USE_NEWS: ${{ vars.USE_NEWS }}
          NEWS_PRE_MIN: ${{ vars.NEWS_PRE_MIN }}
          NEWS_POST_MIN: ${{ vars.NEWS_POST_MIN }}
          REQUEST_PAUSE: ${{ vars.REQUEST_PAUSE }}
          # ตัวเลือกจากปุ่ม Run workflow
          RUN_STATUS: ${{ inputs.status }}
          RUN_IGNORE_HOURS: ${{ inputs.ignore_hours }}
          RUN_DAILY: ${{ inputs.daily }}
          RUN_SUMMARY: ${{ inputs.summary }}
        run: |
          args=""
          [ "$RUN_STATUS" = "true" ] && args="$args --status"
          [ "$RUN_IGNORE_HOURS" = "true" ] && args="$args --ignore-hours"
          [ "$RUN_DAILY" = "true" ] && args="$args --daily"
          [ "$RUN_SUMMARY" = "true" ] && args="$args --summary"
          echo "รันคำสั่ง: python -m signal_bot.main $args"
          python -m signal_bot.main $args

      - name: บันทึกสถานะสัญญาณกลับเข้า repo
        # ต้องทำเพื่อให้รอบถัดไปรู้ว่ามีสัญญาณไหนกำลังติดตามอยู่
        #
        # เดิมใช้ `git pull --rebase` ซึ่งชน conflict ที่ signal_state.json
        # แล้วแก้เองไม่ได้ ลูป retry ก็ชนซ้ำจนจบ step โดยที่สถานะไม่ถูกบันทึก
        # (TP/SL ที่ติดตามอยู่ · จำนวนสัญญาณรายวัน · นาฬิกาทอง · แคชมหภาค
        #  หายหมด) ตอนนี้เก็บไฟล์ไว้นอก repo ก่อน แล้ว reset ตาม remote
        # ให้สะอาด จึงไม่มี conflict ให้แก้ตั้งแต่แรก
        #
        # และรวมสถานะแบบ merge ไม่ใช่ทับ เพราะถ้าอีกรอบหนึ่งเพิ่ง push ไป
        # ระหว่างที่รอบนี้กำลังทำงาน การ cp ทับจะลบงานของรอบนั้นทิ้ง
        if: always()
        run: |
          if [ -z "$(git status --porcelain signal_state.json message_log.json)" ]; then
            echo "ไม่มีการเปลี่ยนแปลงสถานะ"
            exit 0
          fi

          git config user.name "capitalguard-bot"
          git config user.email "bot@users.noreply.github.com"
          cp signal_state.json "$RUNNER_TEMP/signal_state.json"
          # `|| true`: the step runs under `bash -e`, so a false test as the
          # last command of a line would abort the whole save
          [ -f message_log.json ] && cp message_log.json "$RUNNER_TEMP/message_log.json" || true

          saved=0
          for attempt in 1 2 3; do
            git fetch origin main || { sleep $((attempt * 5)); continue; }
            git reset --hard origin/main
            # Merge, never overwrite: a run that finished while this one was
            # working has already pushed its progress, and copying over it
            # would throw that away. See signal_bot/merge_state.py
            python -m signal_bot.merge_state \
              "$RUNNER_TEMP/signal_state.json" signal_state.json
            if [ -f "$RUNNER_TEMP/message_log.json" ]; then
              python -m signal_bot.merge_state \
                "$RUNNER_TEMP/message_log.json" message_log.json
            fi

            if [ -z "$(git status --porcelain signal_state.json message_log.json)" ]; then
              echo "สถานะตรงกับ remote อยู่แล้ว"
              saved=1
              break
            fi

            git add signal_state.json
            [ -f message_log.json ] && git add message_log.json || true
            git commit -m "chore: update signal state [skip ci]"
            if git push; then
              saved=1
              break
            fi
            echo "push ไม่สำเร็จ (ครั้งที่ $attempt) — ลองใหม่"
            sleep $((attempt * 5))
          done

          if [ "$saved" != "1" ]; then
            echo "::error title=บันทึกสถานะไม่สำเร็จ::รอบถัดไปจะไม่เห็นสัญญาณที่กำลังติดตาม"
            exit 1
          fi
